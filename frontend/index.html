<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("bdr-tema") === "light" ? "light" : "dark"; } catch {}
    </script>
    <title>Apuração BDR - Mapa Interativo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
